name: Signed macOS release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing visible version to rebuild without moving its tag'
        required: true
        default: '1.0.4'
        type: string
      source_commit:
        description: 'Full source commit that passed Native checks'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: inotes-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag and release key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          REBUILD_VERSION: ${{ inputs.version }}
          REBUILD_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          release_tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            release_tag="v$REBUILD_VERSION"
            if [[ "$GITHUB_SHA" != "$REBUILD_COMMIT" ]]; then
              echo 'The selected branch no longer matches the reviewed source commit.' >&2
              exit 2
            fi
            if [[ "$GITHUB_RUN_ATTEMPT" != '1' ]]; then
              echo 'Start a new rebuild run to obtain a new build number; do not rerun an updated binary.' >&2
              exit 2
            fi
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tags must use vX.Y.Z.' >&2
            exit 2
          fi
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo 'Configure SPARKLE_PRIVATE_KEY with the existing project seed before releasing.' >&2
            exit 2
          fi
          umask 077
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/inotes-update-key"
          printf 'UPDATE_PRIVATE_KEY_FILE=%s\n' "$RUNNER_TEMP/inotes-update-key" >> "$GITHUB_ENV"
          printf 'VERSION=%s\n' "${release_tag#v}" >> "$GITHUB_ENV"
          printf 'RELEASE_TAG=%s\n' "$release_tag" >> "$GITHUB_ENV"
          # Public run 11 shipped 2012; the isolated backup QA build used 2013.
          # Run 12 built 2014 but failed verification; new run 13 uses 2015.
          printf 'BUILD_NUMBER=%s\n' "$((2002 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Check existing release before rebuilding
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-rebuild.sh --preflight
      - name: Unit and integration tests
        run: bash scripts/test.sh
      - name: Build native ARM64 DMG
        # Ed25519 authenticates updates. Configure Developer ID/notarization locally
        # using docs/BUILD.md before distributing a Gatekeeper-approved installer.
        run: bash scripts/build-macos.sh
      - name: Verify installed bundle and update signatures
        run: |
          dist/iNotes.app/Contents/MacOS/iNotes --smoke-test --editor-test
          bash scripts/verify-macos.sh
          archive="dist/iNotes-$VERSION-arm64.dmg"
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            archive="dist/iNotes-$VERSION-build$BUILD_NUMBER-arm64.dmg"
            cp "dist/iNotes-$VERSION-arm64.dmg" "$archive"
            (cd dist && shasum -a 256 "$(basename "$archive")" > "$(basename "$archive").sha256")
          fi
          bash scripts/generate-appcast.sh "$archive"
          bash scripts/test-update-signatures.sh dist/update/appcast.xml "$archive"
      - name: Publish release assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file="docs/releases/$VERSION.md"
          if [[ ! -f "$notes_file" ]]; then
            notes_file="$RUNNER_TEMP/inotes-release-notes.md"
            printf '%s\n' 'Native Apple silicon build with signed automatic updates. This build uses ad hoc code signing; Apple Developer ID signing and notarization are separate steps documented in docs/BUILD.md.' > "$notes_file"
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/iNotes-$VERSION-arm64.dmg" \
            "dist/iNotes-$VERSION-arm64.dmg.sha256" \
            dist/update/appcast.xml \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "iNotes $VERSION" \
            --notes-file "$notes_file"
      - name: Publish verified same-version rebuild
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-rebuild.sh --publish
      - name: Remove signing seed from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/inotes-update-key"
